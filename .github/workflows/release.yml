name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/package-binaries.mjs --linux AppImage tar.gz --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/package-binaries.mjs --win zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/package-binaries.mjs --mac zip --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.AppImage artifacts/*.tar.gz artifacts/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files downloaded"
            ls -la artifacts || true
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "WhatsApp Archive Viewer ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
